name: Deploy to AWS

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-aws-develop
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: im5pro-hrms
  # Role ARN is public identity; security is enforced by IAM OIDC trust policy.
  AWS_ROLE_ARN: arn:aws:iam::010829527639:role/github-actions-im5pro-deploy
  SSM_PREFIX: /im5pro-hrms/github-actions

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Validate server
        working-directory: server
        run: |
          npm ci
          npm test
          npm run verify:nav-permissions

      - name: Validate client build
        working-directory: client
        run: |
          npm ci
          npm run test -- --run
          npm run build
        env:
          CI: false
          VITE_API_URL: https://placeholder.cloudfront.net/api

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: github-actions-im5pro-deploy

      - name: Load deploy config from SSM
        shell: bash
        run: |
          get_param() {
            aws ssm get-parameter \
              --name "$1" \
              --with-decryption \
              --query Parameter.Value \
              --output text | tr -d '\r'
          }

          MONGODB_URI=$(get_param "$SSM_PREFIX/mongodb-uri")
          JWT_SECRET=$(get_param "$SSM_PREFIX/jwt-secret")
          JWT_REFRESH_SECRET=$(get_param "$SSM_PREFIX/jwt-refresh-secret")
          SUPER_ADMIN_SETUP_KEY=$(get_param "$SSM_PREFIX/super-admin-setup-key")

          # Always prefer CloudFormation output for ClientOrigin (must be a URL, never HTML).
          CLIENT_ORIGIN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text 2>/dev/null || true)
          CLIENT_ORIGIN=$(printf '%s' "$CLIENT_ORIGIN" | tr -d '\r\n')

          if [ -z "$CLIENT_ORIGIN" ] || [ "$CLIENT_ORIGIN" = "None" ]; then
            CLIENT_ORIGIN=$(get_param "$SSM_PREFIX/client-origin" || true)
            CLIENT_ORIGIN=$(printf '%s' "$CLIENT_ORIGIN" | tr -d '\r\n')
          fi

          case "$CLIENT_ORIGIN" in
            https://*)
              ;;
            *)
              echo "::error::CLIENT_ORIGIN must be an https URL. Got: ${CLIENT_ORIGIN:0:80}"
              exit 1
              ;;
          esac

          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$JWT_REFRESH_SECRET"
          echo "::add-mask::$SUPER_ADMIN_SETUP_KEY"

          {
            echo "MONGODB_URI<<EOF"
            printf '%s\n' "$MONGODB_URI"
            echo "EOF"
            echo "JWT_SECRET<<EOF"
            printf '%s\n' "$JWT_SECRET"
            echo "EOF"
            echo "JWT_REFRESH_SECRET<<EOF"
            printf '%s\n' "$JWT_REFRESH_SECRET"
            echo "EOF"
            echo "SUPER_ADMIN_SETUP_KEY<<EOF"
            printf '%s\n' "$SUPER_ADMIN_SETUP_KEY"
            echo "EOF"
            echo "CLIENT_ORIGIN<<EOF"
            printf '%s\n' "$CLIENT_ORIGIN"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "Loaded deploy config. CLIENT_ORIGIN=$CLIENT_ORIGIN"

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: SAM build
        working-directory: sam
        shell: bash
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          sam build --region "$AWS_REGION"

      - name: SAM deploy
        working-directory: sam
        shell: bash
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          overrides = [
              f"MongoDBUri={os.environ['MONGODB_URI']}",
              f"JwtSecret={os.environ['JWT_SECRET']}",
              f"JwtRefreshSecret={os.environ['JWT_REFRESH_SECRET']}",
              f"SuperAdminSetupKey={os.environ['SUPER_ADMIN_SETUP_KEY']}",
              f"ClientOrigin={os.environ['CLIENT_ORIGIN']}",
          ]
          cmd = [
              "sam", "deploy",
              "--region", os.environ["AWS_REGION"],
              "--stack-name", os.environ["STACK_NAME"],
              "--resolve-s3",
              "--capabilities", "CAPABILITY_IAM",
              "--no-confirm-changeset",
              "--no-fail-on-empty-changeset",
              "--parameter-overrides", *overrides,
          ]
          print("Deploying with ClientOrigin=", os.environ["CLIENT_ORIGIN"])
          sys.exit(subprocess.call(cmd))
          PY

      - name: Fetch stack outputs
        id: stack_out
        shell: bash
        run: |
          set -euo pipefail
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text | tr -d '\r\n')
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text | tr -d '\r\n')
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text | tr -d '\r\n')

          if [ -z "$CF_URL" ] || [ "$CF_URL" = "None" ]; then
            echo "::error::CloudFrontUrl output missing from stack $STACK_NAME"
            exit 1
          fi
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "::error::FrontendBucketName output missing from stack $STACK_NAME"
            exit 1
          fi
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::CloudFrontDistributionId output missing from stack $STACK_NAME"
            exit 1
          fi

          {
            echo "CF_URL<<EOF"
            printf '%s\n' "$CF_URL"
            echo "EOF"
            echo "FRONTEND_BUCKET<<EOF"
            printf '%s\n' "$BUCKET"
            echo "EOF"
            echo "DIST_ID<<EOF"
            printf '%s\n' "$DIST_ID"
            echo "EOF"
            echo "VITE_API_URL<<EOF"
            printf '%s\n' "${CF_URL}/api"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "Stack outputs ready:"
          echo "  CF_URL=$CF_URL"
          echo "  FRONTEND_BUCKET=$BUCKET"
          echo "  DIST_ID=$DIST_ID"

      - name: Build and upload frontend
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_BUCKET:-}" ]; then
            echo "::error::FRONTEND_BUCKET is empty"
            exit 1
          fi
          echo "Building frontend for API ${VITE_API_URL}"
          echo "Uploading to s3://${FRONTEND_BUCKET}"
          npm ci
          npm run build
          aws s3 sync build "s3://${FRONTEND_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### AWS deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App URL: $CF_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: $VITE_API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend bucket: $FRONTEND_BUCKET" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: develop" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stack: $STACK_NAME" >> "$GITHUB_STEP_SUMMARY"
