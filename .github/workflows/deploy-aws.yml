name: Deploy to AWS

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-aws-develop
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: im5pro-hrms
  # Role ARN is public identity; security is enforced by IAM OIDC trust policy.
  AWS_ROLE_ARN: arn:aws:iam::010829527639:role/github-actions-im5pro-deploy
  SSM_PREFIX: /im5pro-hrms/github-actions

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Validate server
        working-directory: server
        run: |
          npm ci
          npm test
          npm run verify:nav-permissions

      - name: Validate client build
        working-directory: client
        run: |
          npm ci
          npm run test -- --run
          npm run build
        env:
          CI: false
          VITE_API_URL: https://placeholder.cloudfront.net/api

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: github-actions-im5pro-deploy

      - name: Load deploy config from SSM
        shell: bash
        run: |
          get_param() {
            aws ssm get-parameter \
              --name "$1" \
              --with-decryption \
              --query Parameter.Value \
              --output text | tr -d '\r'
          }

          MONGODB_URI=$(get_param "$SSM_PREFIX/mongodb-uri")
          JWT_SECRET=$(get_param "$SSM_PREFIX/jwt-secret")
          JWT_REFRESH_SECRET=$(get_param "$SSM_PREFIX/jwt-refresh-secret")
          SUPER_ADMIN_SETUP_KEY=$(get_param "$SSM_PREFIX/super-admin-setup-key")
          CLIENT_ORIGIN=$(get_param "$SSM_PREFIX/client-origin")

          if [ -z "$CLIENT_ORIGIN" ] || [ "$CLIENT_ORIGIN" = "https://localhost" ]; then
            STACK_ORIGIN=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
              --output text 2>/dev/null || true)
            STACK_ORIGIN=$(printf '%s' "$STACK_ORIGIN" | tr -d '\r\n')
            if [ -n "$STACK_ORIGIN" ] && [ "$STACK_ORIGIN" != "None" ]; then
              CLIENT_ORIGIN="$STACK_ORIGIN"
            fi
          fi

          if [ -z "$CLIENT_ORIGIN" ] || [ "$CLIENT_ORIGIN" = "None" ]; then
            CLIENT_ORIGIN="https://localhost"
          fi

          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$JWT_REFRESH_SECRET"
          echo "::add-mask::$SUPER_ADMIN_SETUP_KEY"

          {
            echo "MONGODB_URI<<EOF"
            printf '%s\n' "$MONGODB_URI"
            echo "EOF"
            echo "JWT_SECRET<<EOF"
            printf '%s\n' "$JWT_SECRET"
            echo "EOF"
            echo "JWT_REFRESH_SECRET<<EOF"
            printf '%s\n' "$JWT_REFRESH_SECRET"
            echo "EOF"
            echo "SUPER_ADMIN_SETUP_KEY<<EOF"
            printf '%s\n' "$SUPER_ADMIN_SETUP_KEY"
            echo "EOF"
            echo "CLIENT_ORIGIN<<EOF"
            printf '%s\n' "$CLIENT_ORIGIN"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "Loaded SSM config. CLIENT_ORIGIN=$CLIENT_ORIGIN"

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: SAM build
        working-directory: sam
        shell: bash
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          sam build --region "$AWS_REGION"

      - name: SAM deploy
        working-directory: sam
        shell: bash
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          sam deploy \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
            "MongoDBUri=${MONGODB_URI}" \
            "JwtSecret=${JWT_SECRET}" \
            "JwtRefreshSecret=${JWT_REFRESH_SECRET}" \
            "SuperAdminSetupKey=${SUPER_ADMIN_SETUP_KEY}" \
            "ClientOrigin=${CLIENT_ORIGIN}"

      - name: Fetch stack outputs
        id: outputs
        shell: bash
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output json)

          CF_URL=$(printf '%s' "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudFrontUrl") | .OutputValue' || true)
          BUCKET=$(printf '%s' "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue' || true)
          DIST_ID=$(printf '%s' "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue' || true)

          if [ -z "$CF_URL" ] || [ "$CF_URL" = "null" ]; then
            echo "CloudFrontUrl output missing from stack $STACK_NAME"
            exit 1
          fi
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "null" ]; then
            echo "FrontendBucketName output missing from stack $STACK_NAME"
            exit 1
          fi
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "null" ]; then
            echo "CloudFrontDistributionId output missing from stack $STACK_NAME"
            exit 1
          fi

          {
            echo "cf_url<<EOF"
            printf '%s\n' "$CF_URL"
            echo "EOF"
            echo "bucket<<EOF"
            printf '%s\n' "$BUCKET"
            echo "EOF"
            echo "dist_id<<EOF"
            printf '%s\n' "$DIST_ID"
            echo "EOF"
            echo "api_url<<EOF"
            printf '%s\n' "${CF_URL}/api"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ steps.outputs.api_url }}
          FRONTEND_BUCKET: ${{ steps.outputs.bucket }}
        shell: bash
        run: |
          npm ci
          npm run build
          aws s3 sync build "s3://${FRONTEND_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        env:
          DIST_ID: ${{ steps.outputs.dist_id }}
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

      - name: Deployment summary
        env:
          CF_URL: ${{ steps.outputs.cf_url }}
          API_URL: ${{ steps.outputs.api_url }}
        run: |
          echo "### AWS deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App URL: $CF_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: develop" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stack: $STACK_NAME" >> "$GITHUB_STEP_SUMMARY"
